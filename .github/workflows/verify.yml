name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 evaluator.py
      - run: python3 -m unittest tests/test_passkey_boundary.py -v
      - run: bash verify.sh
